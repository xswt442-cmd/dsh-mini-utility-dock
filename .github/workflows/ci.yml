name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install
      - run: npm test
      # Every fragment, not a named one: a fragment can be retired or renamed, and
      # a hardcoded path here silently breaks the gate when it is.
      - run: for f in dist/*.js; do node --check "$f"; done
      - run: node --check bin/dsh-mini-utility-dock.js
      - run: npm pack --dry-run
