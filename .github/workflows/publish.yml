name: publish

on:
  push:
    tags: ['v*']

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Verify tag and package
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME"
          npm install
          npm test
          node --check dist/bootstrap.js
          node --check bin/dsh-mini-utility-dock.js
          npm pack --dry-run
      - name: Check registry
        id: registry
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "dsh-mini-utility-dock@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.registry.outputs.published != 'true'
        run: npm publish --provenance --access public
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PKG_VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          # The release body is the version's own CHANGELOG section, exactly like
          # the sibling plugins — `--generate-notes` produced a bare compare link
          # and ignored the curated notes.
          notes=$(node <<'NODE'
          const fs = require('fs')
          const version = process.env.PKG_VERSION.replace(/^v/, '')
          const escaped = version.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
          const heading = new RegExp(`^## (?:\\[${escaped}\\]|${escaped}(?:\\s|$))`)
          let inSection = false
          const lines = []
          for (const line of fs.readFileSync('CHANGELOG.md', 'utf8').split('\n')) {
            if (line.startsWith('## ')) {
              if (inSection) break
              inSection = heading.test(line)
              continue
            }
            if (inSection) lines.push(line)
          }
          console.log(lines.join('\n').trim() || `Release ${version}`)
          NODE
          )
          tag=$GITHUB_REF_NAME
          repo=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}
          prev=$(git fetch --tags --quiet && git describe --tags --abbrev=0 "$tag^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            notes=$(printf '%s\n\n**完整变更**: [`%s...%s`](%s/compare/%s...%s)' "$notes" "$prev" "$tag" "$repo" "$prev" "$tag")
          else
            notes=$(printf '%s\n\n**完整变更**: [`%s`](%s/commits/%s)' "$notes" "$tag" "$repo" "$tag")
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "GitHub release $tag already exists"
          else
            gh release create "$tag" --title "$tag" --notes "$notes"
          fi
