name: publish

on:
  push:
    tags: ['v*']

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Verify tag and package
        id: sanity
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME"
          npm install
          npm test
          for f in dist/*.js; do node --check "$f"; done
          node --check bin/dsh-mini-utility-dock.js
          npm pack --dry-run
      - name: Check registry
        id: registry
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "dsh-mini-utility-dock@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.registry.outputs.published != 'true'
        run: npm publish --provenance --access public
      - name: GitHub release from changelog (idempotent)
        if: always() && steps.sanity.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          notes=$(node scripts/release-notes.mjs "$version")
          tag=$GITHUB_REF_NAME
          repo=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}
          prev=$(git fetch --tags --quiet && git describe --tags --abbrev=0 "$tag^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            notes=$(printf '%s\n\n**完整变更**: [`%s...%s`](%s/compare/%s...%s)' "$notes" "$prev" "$tag" "$repo" "$prev" "$tag")
          else
            notes=$(printf '%s\n\n**完整变更**: [`%s`](%s/commits/%s)' "$notes" "$tag" "$repo" "$tag")
          fi
          # Not gated on the publish step: a version published out of band — like
          # the first one, before npm knows this package name at all — still needs
          # its notes here. Re-running must converge rather than fail over an
          # occupied name, so an existing release is refreshed instead.
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::warning::release $tag already exists - refreshing its notes"
            gh release edit "$tag" --title "$tag" --notes "$notes"
          else
            gh release create "$tag" --title "$tag" --notes "$notes"
          fi
